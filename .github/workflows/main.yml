name: 🍀 Generate GitHub Profile Readme Content

on:
  # Run automatically every 24 hours at 20:00 UTC
  schedule:
    - cron: "00 20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  main:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 📈 Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=react-dark&hide_border=true&area=true&color=76C457&line=2A7C13&point=76C457&bg_color=070b08
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧮 Generate stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&hide_border=true&title_color=76C457&icon_color=76C457&text_color=9cb59c&bg_color=070b08
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔥 Generate top languages card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&title_color=76C457&text_color=76C457&bg_color=070b08
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✨ Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=black-ice&hide_border=true&stroke=0000&background=070b08&ring=76C457&fire=76C457&currStreakLabel=76C457
          path: dist/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#76C457&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#76C457&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: 🚀 Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
